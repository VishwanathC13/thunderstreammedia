version: '3.8'
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: thunderstream
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"

  redis:
    image: redis:7
    restart: unless-stopped
    # keyspace notifications aren't required by the seat-hold code (holds
    # are read lazily via TTL checks, not pushed), but harmless to enable
    # in case a future real-time "seat released" broadcast wants them.
    command: ["redis-server", "--notify-keyspace-events", "Ex"]
    ports:
      - "6379:6379"

volumes:
  db_data:
